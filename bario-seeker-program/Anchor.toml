[toolchain]
package_manager = "pnpm"

[features]
resolution = true
skip-lint = false

[programs.localnet]
bario_seeker_program = "7aTL3mhtrRg57Jr3dBmTgHYHufmsepzhPqbYMhioV5Yc"

[programs.devnet]
bario_seeker_program = "7aTL3mhtrRg57Jr3dBmTgHYHufmsepzhPqbYMhioV5Yc"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "localnet"
wallet = "~/.config/solana/id.json"

# Metaplex Core, dumped from devnet. The soulbound guarantee is enforced by this
# program, so the tests must run against the real thing rather than a mock.
[[test.genesis]]
address = "CoREENxT6tW1HoK8ypY1SxRMZTcVPm7R94rH4PZNhX7d"
program = "tests/fixtures/mpl_core.so"

[scripts]
test = "pnpm exec ts-mocha -p ./tsconfig.json -t 1000000 \"tests/**/*.ts\""
seed = "pnpm exec ts-node scripts/seed-devnet.ts"
verify = "pnpm exec ts-node scripts/verify-devnet.ts"
